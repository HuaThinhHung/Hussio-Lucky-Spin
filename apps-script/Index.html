:root {
  color-scheme: dark;
}
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--color-navy-dark);
  color: var(--color-ivory);
  font-family: var(--font-sans);
  overflow-x: hidden;
}
::selection {
  background: var(--color-gold);
  color: var(--color-navy-dark);
}
:focus-visible {
  outline: 2px solid var(--color-gold-light);
  outline-offset: 3px;
}
section[id] {
  scroll-margin-top: 5rem;
}
.bg-hussio-gradient {
  background: radial-gradient(120% 60% at 50% 0%, rgba(199, 161, 90, 0.12) 0%, rgba(199, 161, 90, 0) 55%), linear-gradient(180deg, #0a1628 0%, #172b49 100%);
}
.gold-rule {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(199, 161, 90, 0.7), transparent);
}
.text-gold-gradient {
  background: linear-gradient(180deg, #f1dca8 0%, #c7a15a 55%, #a8843f 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.gold-glow {
  box-shadow: 0 0 0 1px rgba(229, 201, 133, 0.25), 0 0 40px rgba(199, 161, 90, 0.25), 0 0 120px rgba(199, 161, 90, 0.12);
}
@keyframes particle-float {
  0% {
    transform: translate3d(0, 0, 0);
    opacity: 0;
  }
  15% {
    opacity: var(--particle-opacity, 0.5);
  }
  85% {
    opacity: var(--particle-opacity, 0.5);
  }
  100% {
    transform: translate3d(var(--particle-drift, 12px), -140px, 0);
    opacity: 0;
  }
}
.light-particle {
  position: absolute;
  width: var(--particle-size, 3px);
  height: var(--particle-size, 3px);
  border-radius: 9999px;
  background: radial-gradient(circle, #f6e7bf 0%, rgba(229, 201, 133, 0) 70%);
  animation: particle-float var(--particle-duration, 9s) ease-in-out var(--particle-delay, 0s) infinite;
  pointer-events: none;
}
@keyframes rim-twinkle {
  0%, 100% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
}
.wheel-rim-dot {
  opacity: 0.55;
}
.is-spinning .wheel-rim-dot {
  animation: rim-twinkle 0.6s ease-in-out infinite;
}
.is-spinning .wheel-rim-dot:nth-child(2n) {
  animation-delay: 0.3s;
}
@keyframes winner-pulse {
  0%, 100% {
    opacity: 0.15;
  }
  50% {
    opacity: 0.45;
  }
}
.wheel-winner-glow {
  animation: winner-pulse 1.4s ease-in-out infinite;
}
@keyframes confetti-fall {
  0% {
    transform: translate3d(0, -10vh, 0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate3d(var(--confetti-drift, 0px), 105vh, 0) rotate(var(--confetti-spin, 540deg));
    opacity: 0.2;
  }
}
.confetti-piece {
  position: absolute;
  top: 0;
  width: var(--confetti-w, 6px);
  height: var(--confetti-h, 12px);
  background: var(--confetti-color, #c7a15a);
  border-radius: 1px;
  animation: confetti-fall var(--confetti-duration, 2.6s) cubic-bezier(0.2, 0.6, 0.4, 1) var(--confetti-delay, 0s) forwards;
  will-change: transform;
}
@keyframes fade-up {
  from {
    opacity: 0;
    transform: translate3d(0, 12px, 0);
  }
  to {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
}
.animate-fade-up {
  animation: fade-up 0.5s ease-out both;
}
dialog.result-dialog {
  max-width: min(92vw, 30rem);
  width: 100%;
  margin: auto;
  padding: 0;
  border: none;
  background: transparent;
  color: inherit;
}
dialog.result-dialog::backdrop {
  background: rgba(6, 13, 25, 0.78);

.public-theme {

  --theme-ivory-dark: #deded8;
  --theme-gold: #e4383e;
  --theme-gold-light: #f66368;
  --theme-gold-deep: #b91c22;
  --font-display: var(--font-be-vietnam), Arial, sans-serif;
  background: #111111;

.public-theme[data-theme="light"] {
  color-scheme: light;
  --theme-navy: #ffffff;
  --theme-navy-dark: #f2f2ee;
  --theme-navy-mid: #e9e9e5;
  --theme-navy-soft: #deded8;
  --theme-ivory: #171717;

}
.public-theme .wheel-artwork {

.campaign-header {
  max-width: 1280px;
  margin: auto;
  padding: 24px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--theme-ivory);
  @supports (color: color-mix(in lab, red, red)) {
    border-bottom: 1px solid color-mix(in srgb, var(--theme-ivory) 15%, transparent);
  }
}
.campaign-heading {
  max-width: 1280px;
  margin: auto;
  padding: 32px 32px 24px;
}
.campaign-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 10px;
  letter-spacing: .18em;
  font-weight: 600;
}
.campaign-kicker > span {
  width: 7px;
  height: 7px;
  background: #d92d32;
}
.campaign-title-row {

  align-items: center;
  justify-content: space-between;
  gap: 32px;
  margin-top: 18px;
}
.campaign-title-row h1 {

  line-height: .95;
  font-weight: 800;
  letter-spacing: -.075em;
}
.campaign-title-row h1 > span {
  display: block;
}
.campaign-offer {
  border-left: 2px solid #d92d32;
  padding: 8px 0 8px 24px;
}
.campaign-offer p {
  font-size: 11px;
  letter-spacing: .16em;
  line-height: 1.8;
}
.campaign-offer strong {
  display: block;
  margin: 10px 0;
  font-size: clamp(28px,4vw,48px);
  letter-spacing: -.05em;
}
.campaign-offer strong span {
  font-size: 18px;
  margin-left: 6px;
}
.campaign-baseline {
  display: flex;
  justify-content: space-between;
  margin-top: 26px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--theme-ivory);
  @supports (color: color-mix(in lab, red, red)) {
    border-bottom: 1px solid color-mix(in srgb,var(--theme-ivory) 15%,transparent);
  }
  font-size: 9px;
  letter-spacing: .17em;
  opacity: .55;
}
.spin-stage {
  padding-top: 12px;
}
.code-entry-panel {
  position: relative;
}
.code-entry-panel::before {
  content: '';
  position: absolute;
  left: -1px;
  top: -1px;
  width: 40px;
  height: 3px;
  background: #d92d32;
}
.code-entry-panel h2 {
  font-weight: 700;
  letter-spacing: -.04em;
}
.public-theme .font-display {
  font-family: var(--font-be-vietnam),sans-serif;
}
.public-theme .gold-glow {
  box-shadow: none;
}
.campaign-info {
  max-width: 1216px;
  margin: 0 auto;
  padding: 32px 0;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 40px;
  border-top: 1px solid var(--theme-ivory);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb,var(--theme-ivory) 15%,transparent);
  }
}
.info-index {
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--theme-gold);
  font-weight: 600;
}
.campaign-info h2 {
  font-size: 16px;
  font-weight: 600;
  margin: 14px 0 8px;
  letter-spacing: -.03em;
}
.campaign-info p,.campaign-bottom p {
  font-size: 12px;
  line-height: 1.9;
  opacity: .65;
}
.campaign-bottom {
  max-width: 1216px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  border-top: 1px solid var(--theme-ivory);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb,var(--theme-ivory) 15%,transparent);
  }
  padding: 28px 0;
}
.campaign-bottom a {
  font-size: 11px;
  display: inline-block;
  margin-top: 12px;
  text-decoration: underline;
  text-underline-offset: 5px;
}
.campaign-bottom summary {
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 8px 0 15px;
}
.campaign-footer {
  max-width: 1216px;
  margin: auto;
  border-top: 1px solid var(--theme-ivory);
  @supports (color: color-mix(in lab, red, red)) {
    border-top: 1px solid color-mix(in srgb,var(--theme-ivory) 15%,transparent);
  }
  display: flex;
  justify-content: space-between;
  padding: 20px 0;
  font-size: 9px;
  letter-spacing: .13em;
  opacity: .5;
}
@media (max-width: 1279px) {
  .campaign-info,.campaign-bottom,.campaign-footer {
    margin-left: 32px;
    margin-right: 32px;
  }
}
@media (max-width: 639px) {
  .campaign-header {
    padding: 18px 20px;
  }
  .campaign-header > div {
    gap: 12px;
  }
  .campaign-heading {
    padding: 26px 20px 12px;
  }
  .campaign-title-row {
    align-items: end;
    gap: 16px;
  }
  .campaign-title-row h1 {
    font-size: clamp(49px,14vw,82px);
  }
  .campaign-offer {
    padding-left: 12px;
    margin-bottom: 2px;
  }
  .campaign-offer p {
    font-size: 8px;
    letter-spacing: .04em;
  }
  .campaign-offer strong {
    font-size: 21px;
    margin: 5px 0;
  }
  .campaign-offer strong span {
    font-size: 10px;
    margin-left: 2px;
  }
  .campaign-kicker {
    font-size: 8px;
  }
  .campaign-baseline {
    font-size: 7px;
    letter-spacing: .08em;
    margin-top: 22px;
  }
  .campaign-info {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .campaign-bottom {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .campaign-info,.campaign-bottom,.campaign-footer {
    margin-left: 20px;
    margin-right: 20px;
  }
}

/* Airy portfolio composition with a large interactive object on the left. */
.public-theme { position: relative; isolation: isolate; overflow: clip; --pointer-x: 0px; --pointer-y: 0px; }
.public-theme[data-theme="light"] { background: #fefefe; --theme-navy-dark: #f7f7f9; --theme-navy: #fff; }
.ambient-scene { position: absolute; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; opacity: .65; }
.ambient-ribbon { position: absolute; border-radius: 46%; width: 1050px; height: 500px; border: 32px solid transparent; background: linear-gradient(var(--theme-navy-dark),var(--theme-navy-dark)) padding-box, conic-gradient(from 10deg,#ff92bf,#dac6ff,#c7fff0,#f4ff9d,#ff92bf) border-box; filter: blur(18px); transform: translate3d(var(--pointer-x),var(--pointer-y),0) rotate(-32deg); animation: ribbon-drift 22s ease-in-out infinite alternate; }
.ribbon-one { top: -420px; left: -360px; }
.ribbon-two { top: 40px; right: -820px; width: 1200px; height: 650px; animation-delay: -11s; }
.ambient-orb { position: absolute; top: 600px; left: -200px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle,#e8ccff66,transparent 65%); transform: translate3d(calc(var(--pointer-x) * -2),var(--pointer-y),0); }
[data-theme="dark"] .ambient-scene { opacity: .16; }
.brand-watermark { position: absolute; top: 650px; left: 2%; width: 96%; text-align: center; font-size: clamp(100px,22vw,360px); font-weight: 800; letter-spacing: -.06em; line-height: 1; color: var(--theme-ivory); opacity: .035; pointer-events: none; z-index: -1; }
.campaign-header { max-width: none; border: 0; padding: 24px 36px; }
.campaign-header > span { border: 1px solid color-mix(in srgb,var(--theme-ivory) 12%,transparent); border-radius: 40px; padding: 12px 20px; font-size: 16px; background: color-mix(in srgb,var(--theme-navy) 65%,transparent); backdrop-filter: blur(12px); }
.campaign-header button { border-radius: 30px; }
.public-theme main { position: relative; }
.campaign-heading { position: absolute; width: 34%; max-width: 460px; top: 40px; right: max(5%,calc((100vw - 1400px)/2)); padding: 0; text-align: center; }
.campaign-kicker { justify-content: center; font-size: 9px; letter-spacing: .12em; }
.campaign-title-row { display: block; margin-top: 16px; }
.campaign-title-row h1 { font-size: clamp(42px,4.8vw,72px); letter-spacing: -.06em; line-height: 1.04; }
.campaign-title-row h1 > span { display: inline; margin-left: .12em; }
.campaign-offer { border: 0; padding: 0; margin-top: 18px; display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 6px; }
.campaign-offer strong { font-size: 23px; margin: 0 4px; }
.campaign-offer p { font-size: 9px; letter-spacing: .05em; }
.campaign-offer p:last-child { width: 100%; }
.campaign-baseline { justify-content: center; gap: 20px; border: 0; margin-top: 12px; padding: 0; font-size: 8px; }
.spin-stage { max-width: 1500px; padding-top: 20px; padding-bottom: 85px; }
.spin-stage > .grid { grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); gap: 5%; min-height: 700px; }
.spin-stage > .grid > .order-2 { margin-top: 260px; width: 100%; max-width: 460px; justify-self: center; }
.spin-stage .wheel-artwork { max-width: min(60vw,760px); filter: drop-shadow(0 24px 35px #00000018); }
.code-entry-panel { border-radius: 28px; background: color-mix(in srgb,var(--theme-navy) 68%,transparent); border-color: color-mix(in srgb,var(--theme-ivory) 10%,transparent); backdrop-filter: blur(20px); box-shadow: 0 12px 50px #00000004; padding: 24px; }
.code-entry-panel::before { display: none; }
.code-entry-panel > p:first-child { font-size: 9px; letter-spacing: .15em; }
.code-entry-panel h2 { font-size: 20px; margin-top: 12px; }
.code-entry-panel > p { font-size: 12px; }
.code-entry-panel input { border-radius: 30px; background: transparent; font-size: 12px; padding-left: 18px; }
.code-entry-panel button { border-radius: 30px; font-size: 11px; }
.campaign-info { gap: 16px; border: 0; padding-top: 0; }
.campaign-info > div { border: 1px solid color-mix(in srgb,var(--theme-ivory) 10%,transparent); border-radius: 20px; padding: 24px; background: color-mix(in srgb,var(--theme-navy) 55%,transparent); backdrop-filter: blur(10px); }
.campaign-bottom,.campaign-footer { border-color: color-mix(in srgb,var(--theme-ivory) 8%,transparent); }
@keyframes ribbon-drift { from { transform: translate3d(var(--pointer-x),var(--pointer-y),0) rotate(-32deg) scale(1); } to { transform: translate3d(calc(var(--pointer-x) + 40px),calc(var(--pointer-y) + 20px),0) rotate(-24deg) scale(1.1); } }
@media(max-width: 1023px) {
 .campaign-heading { position: relative; width: auto; max-width: none; right: auto; top: auto; padding: 20px; }
 .campaign-title-row h1 { font-size: 48px; }
 .spin-stage > .grid { grid-template-columns: 1fr; min-height: 0; gap: 32px; }
 .spin-stage > .grid > .order-2 { margin-top: 0; max-width: 500px; }
 .spin-stage .wheel-artwork { max-width: min(85vw,650px); }
 .campaign-info { grid-template-columns: 1fr; }
 .brand-watermark { top: 500px; }
}
@media(max-width: 639px) {
 .campaign-header { padding: 18px 20px; } .campaign-header > span { padding: 10px 14px; font-size: 13px; }
 .campaign-title-row h1 { font-size: 40px; } .campaign-offer strong { font-size: 22px; }
 .spin-stage { padding-bottom: 45px; } .code-entry-panel { padding: 24px; }
 .ribbon-two { right: -1000px; } .campaign-info { gap: 12px; }
}
@media(prefers-reduced-motion: reduce) { .ambient-ribbon { animation: none; transform: rotate(-32deg); } .ambient-orb { transform: none; } }

@media (hover: hover) and (prefers-reduced-motion: no-preference) {
 .spin-stage .wheel-artwork { transform: perspective(1500px) rotateY(var(--tilt-y, 0deg)) rotateX(var(--tilt-x, 0deg)); transition: transform .35s ease-out; }

.public-theme { font-family: "Hussio Hanken", Arial, sans-serif; --font-be-vietnam: "Hussio Hanken"; }
.public-theme .header-logo { display: inline-flex; width: 150px; padding: 12px 0; }
.header-logo img { width: 100%; height: auto; }
[data-theme="dark"] .header-logo img { filter: brightness(0) invert(1); }
/* Sized to the large viewport so the phone URL bar showing/hiding never resizes (and resets) the simulation. */
.fluid-background { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; z-index: -1; pointer-events: none; opacity: 1; background: transparent; }
.fluid-background canvas { display: block; width: 100%; height: 100%; }
[data-theme="dark"] .fluid-background { opacity: .7; background: transparent; }
.ambient-scene { display: none; }
.brand-watermark { display: none; }
.footer-wordmark { position: relative; display: block; width: 100%; overflow: hidden; text-align: center; font-size: clamp(100px,22vw,360px); font-weight: 800; letter-spacing: -.055em; line-height: 1.05; color: var(--theme-ivory); opacity: .045; margin: 10px auto 32px; pointer-events: none; }
@media(max-width:639px) { .public-theme .header-logo { width: 115px; } .footer-wordmark { margin: 0 auto 24px; } }
@media(prefers-reduced-motion:reduce) { .fluid-background { display: none; } }

.footer-wordmark { color: #1c223c; opacity: .09; }

.size-selection { max-width:1400px; margin:230px auto 36px; padding:24px 32px; border-block:1px solid #ddd; }
.size-selection h2,.gift-list h2 {font-size:24px;font-weight:700;margin:8px 0}.size-selection p{font-size:14px;margin:10px 0}.size-selection small{color:#777}
.size-groups{display:flex;gap:40px;flex-wrap:wrap;margin:18px 0}.size-groups legend{font-weight:600;margin-bottom:10px}.size-groups button{min-width:54px;padding:12px;border:1px solid #bbb;border-radius:8px;margin-right:8px}.size-groups button[aria-pressed=true]{background:#1c223c;color:white;border-color:#1c223c}
.gift-list{max-width:1400px;margin:24px auto;padding:24px 32px}.gift-list>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.gift-list article{border:1px solid #ccc;padding:16px;border-radius:12px}.gift-list p{font-size:13px;margin:8px 0}.gift-muted{background:#202229;color:#a6a8af}.gift-eligible{border-color:#1c223c!important;background:#eef2ff;color:#1c223c}
@media(min-width:1024px){.spin-stage > .grid > .order-2{margin-top:0}}
@media(max-width:1023px){.size-selection{margin-top:20px;padding:20px}.gift-list{padding:20px}}

.size-selection {width:100%;max-width:760px;margin:22px 0 0;padding:18px 0;border:0;text-align:left;align-self:flex-start}
.size-selection p{font-size:12px}.size-selection small{font-size:11px}.size-groups{gap:24px;margin:12px 0}.size-groups legend{font-size:12px}.size-groups button{padding:8px;min-width:44px}
.public-theme .font-display {font-family:"Hussio Hanken",Arial,sans-serif}
.spin-stage {padding-top:45px}.spin-stage > .grid > .order-2{margin-top:220px}
.spin-stage .wheel-artwork{transform:none!important}
@media(max-width:1023px){.spin-stage > .grid > .order-2{margin-top:0}.size-selection{padding:12px 0}}

/* Size picker: each button shows how many gifts are still in stock for that size. */
.size-groups button { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 58px; min-height: 52px; margin: 0 8px 8px 0; transition: border-color .15s, background-color .15s, color .15s; }
.size-groups button span { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
.size-groups button small { font-size: 9px; font-weight: 500; letter-spacing: .04em; color: inherit; opacity: .65; }
.size-groups button:hover:not(:disabled) { border-color: #d92d32; }
.size-groups button[aria-pressed=true] { background: #d92d32; border-color: #d92d32; color: #fff; }
.size-groups button:disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
.size-groups fieldset:disabled button[aria-pressed=false] { opacity: .35; }
.size-summary strong { color: #d92d32; font-size: 15px; }
/* Multi-size: a tick on picked sizes; at the 3-size cap the other buttons dim without the sold-out strike. */
.size-groups legend small { font-size: 11px; font-weight: 500; opacity: .55; margin-left: 2px; }
.size-groups button { position: relative; }
.size-groups button i { position: absolute; top: 3px; right: 6px; font-size: 9px; font-style: normal; font-weight: 700; }
.size-groups button[data-full]:disabled { text-decoration: none; opacity: .45; }
.size-matches { margin-top: 4px; }
.size-matches p { margin: 0 0 10px; }
.size-matches strong { color: #d92d32; }
.size-matches ul { display: flex; flex-wrap: wrap; gap: 6px; max-height: 172px; overflow-y: auto; margin: 0 0 8px; padding: 0; list-style: none; }
.size-matches li { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 11px; border: 1px solid #1c223c26; border-radius: 30px; background: #ffffffb8; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.size-matches li small { font-size: 8px; font-weight: 600; letter-spacing: .1em; color: #d92d32; }
[data-theme="dark"] .size-matches li { background: #ffffff10; border-color: #ffffff24; }
.campaign-closed { max-width: 1500px; margin: 0 auto; padding: 0 32px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: #d92d32; text-align: right; }
@media(max-width:1023px) { .campaign-closed { text-align: center; padding: 0 20px 8px; } }
